<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b3d91"
  >

  <title>FindWorker</title>

  <!-- CACHE BUST: forces latest CSS -->
  <link
    rel="stylesheet"
    href="style.css?v=5"
  >
</head>


<body>

  <div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div class="header-top">

        <div>

          <div class="logo">
            Find<span>Worker</span>
          </div>

          <div class="tagline">
            Find trusted workers near you
          </div>

        </div>


        <div class="header-badge">

          <span class="live-dot"></span>

          Local Services

        </div>

      </div>


      <!-- =========================
           SEARCH
      ========================== -->

      <div class="search">

        <span class="search-icon">
          🔍
        </span>


        <input
          id="service-search"
          type="text"
          placeholder="What service do you need?"
          autocomplete="off"
          spellcheck="false"
        >


        <button
          type="button"
          class="search-clear"
          id="search-clear"
          aria-label="Clear search"
        >
          ×
        </button>

      </div>


      <!-- ALL SERVICES DROPDOWN -->

      <div
        id="service-suggestions"
        class="service-suggestions"
      ></div>


    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="content">


      <!-- =========================
           POPULAR SERVICES
      ========================== -->

      <section>

        <div class="section-heading">

          <div>

            <div class="eyebrow">
              EXPLORE SERVICES
            </div>

            <div class="title">
              What do you need?
            </div>

          </div>


          <div class="service-count">
            9 popular
          </div>

        </div>



        <div class="categories">


          <button
            type="button"
            class="category"
            data-service="Electrician"
          >

            <div class="icon">
              ⚡
            </div>

            <span>
              Electrician
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Plumber"
          >

            <div class="icon">
              🚰
            </div>

            <span>
              Plumber
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="AC Repair"
          >

            <div class="icon">
              ❄️
            </div>

            <span>
              AC Repair
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Carpenter"
          >

            <div class="icon">
              🪚
            </div>

            <span>
              Carpenter
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Painter"
          >

            <div class="icon">
              🎨
            </div>

            <span>
              Painter
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Cleaner"
          >

            <div class="icon">
              🧹
            </div>

            <span>
              Cleaner
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Mobile Repair"
          >

            <div class="icon">
              📱
            </div>

            <span>
              Mobile Repair
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Computer Repair"
          >

            <div class="icon">
              💻
            </div>

            <span>
              Computer
            </span>

          </button>



          <button
            type="button"
            class="category"
            data-service="Mechanic"
          >

            <div class="icon">
              🔧
            </div>

            <span>
              Mechanic
            </span>

          </button>


        </div>

      </section>



      <!-- =========================
           WORKERS
      ========================== -->

      <section class="nearby">


        <div class="section-heading worker-heading">

          <div>

            <div class="eyebrow">
              VERIFIED PROFESSIONALS
            </div>

            <div class="title">
              Nearby Workers
            </div>

          </div>


          <div class="verified-mini">
            ✓ Verified
          </div>

        </div>



        <!-- REAL WORKER LIST -->

        <div id="worker-list">

          <div class="loading-card">

            <div class="loading-spinner"></div>

            <div>

              <strong>
                Finding workers...
              </strong>

              <small>
                Loading verified professionals
              </small>

            </div>

          </div>

        </div>


      </section>


    </main>



    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav class="nav">


      <button
        type="button"
        class="nav-item active"
      >

        <div class="nav-icon">
          ⌂
        </div>

        <span>
          Home
        </span>

      </button>



      <button
        type="button"
        class="nav-item"
        id="bottom-search"
      >

        <div class="nav-icon">
          ⌕
        </div>

        <span>
          Search
        </span>

      </button>



      <button
        type="button"
        class="nav-item"
      >

        <div class="nav-icon">
          ▣
        </div>

        <span>
          Requests
        </span>

      </button>



      <button
        type="button"
        class="nav-item"
      >

        <div class="nav-icon">
          ◉
        </div>

        <span>
          Profile
        </span>

      </button>


    </nav>


  </div>



  <!-- =========================
       SUPABASE
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>



  <!-- =========================
       APP JAVASCRIPT
       CACHE BUST
  ========================== -->

  <script
    src="app.js?v=5"
  ></script>


</body>

</html>
